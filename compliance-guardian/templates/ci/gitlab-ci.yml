# compliance-guardian GitLab CI (include from .gitlab-ci.yml). Vendor the scanner into .compliance-guardian/ first.
compliance-guardian:
  image: python:3.12-slim
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q "pyyaml==6.0.2" "jsonschema==4.23.0"
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        python .compliance-guardian/scripts/cg.py scan . --mode changed --since "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --fail-on HIGH
      else
        python .compliance-guardian/scripts/cg.py release . --out compliance-reports
      fi
  artifacts:
    when: always
    paths: [compliance-reports/]
    expire_in: 30 days
