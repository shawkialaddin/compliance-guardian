name: ksa-nca-ecc
description: Evaluate NCA ECC-2:2024. Mandatory only for in-scope entities (government, affiliates, CNI); otherwise contractual or recommended.
frameworks: [ksa_nca_ecc, ksa_nca_dcc, eng_baselines]
