# compliance-guardian regulatory source registry
# ---------------------------------------------------------------------------------------------
# Rules for maintainers (enforced by the update-rules workflow and self-tests):
#  * Official sources first. `verification` values:
#      CONFIRMED          - metadata confirmed on an official regulator/government page or PDF
#      PARTIAL            - existence/name/code confirmed officially; other metadata not
#      THIRD_PARTY_ONLY   - only secondary sources (law firms, trackers) available
#      UNVERIFIED         - not confirmed
#  * Never invent clause numbers, deadlines or legal conclusions. Unknown -> "UNVERIFIED".
#  * baseline_locked: a newer edition is NOT adopted silently. Propose it in CHANGELOG.md with
#    evidence; bump registry_version only after review.
#  * Where an English text is a translation, the Arabic text is binding (noted per source).
registry_version: "2026.11.16"
baseline_locked: true
verified_on: "2026-11-16"
